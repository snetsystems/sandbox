# version: '3.2'
services:
  influxdb:
    image: ch/influxdb:${INFLUXDB_TAG}
    # Full tag list: https://hub.docker.com/r/library/influxdb/tags/
    build:
      context: ./images/influxdb/
      dockerfile: ./Dockerfile
      args:
        INFLUXDB_TAG: ${INFLUXDB_TAG}
    volumes:
      # Mount for influxdb data directory
      - ./influxdb/data:/var/lib/influxdb
      # Mount for influxdb configuration
      - ./influxdb/config/:/etc/influxdb
    ports:
      # The API for InfluxDB is served on port 8086
      - '8086:8086'
      - '8082:8082'
      # UDP Port
      - '8089:8089/udp'
    networks:
      - brg
    restart: always

  kapacitor:
    image: ch/kapacitor:${KAPACITOR_TAG}
    # Full tag list: https://hub.docker.com/r/library/kapacitor/tags/
    build:
      context: ./images/kapacitor/
      dockerfile: ./Dockerfile
      args:
        KAPACITOR_TAG: ${KAPACITOR_TAG}
    profiles:
      - cpu
    volumes:
      # Mount for kapacitor data directory
      - ./kapacitor/data/:/var/lib/kapacitor
      # Mount for kapacitor configuration
      - ./kapacitor/config/:/etc/kapacitor
      # Mount for ai module logs
      - ./kapacitor/logs/:/var/log/kapacitor-ai
      # Mount for kapacitor predict UDF socket path
      - ./kapacitor/sock/:/var/run/kapacitor
      # Mount for ch-ai src path
      - ../ch-ai/src/:/opt/cloudhub/ch-ai-src
      # Mount for conda env path
      - ${CONDA_ENV_PATH}:/opt/cloudhub
    # Kapacitor requires network access to Influxdb
    links:
      - influxdb
    ports:
      # The API for Kapacitor is served on port 9092
      # To avoid collision against Kafka port
      #- "9092:9092"
      - '9094:9092'
    depends_on:
      - influxdb
    networks:
      brg:
        aliases:
          - kapacitor
    restart: always

  kapacitor-gpu:
    image: ch/kapacitor:${KAPACITOR_TAG}
    # Full tag list: https://hub.docker.com/r/library/kapacitor/tags/
    build:
      context: ./images/kapacitor/
      dockerfile: ./Dockerfile-gpu
      args:
        KAPACITOR_TAG: ${KAPACITOR_TAG}
    deploy:
      resources:
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       # count: all
        #       device_ids: ['2','3']
        #       capabilities: [gpu]
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - 'MIG-420ade32-9b96-5afe-957b-f0272e96d3df'
                - 'MIG-e5f22f43-01fe-50ab-81fe-8ea23c6f0101'
                - 'MIG-eeb2f7ce-7451-55e6-b2a4-e8191e4d1905'
                - 'MIG-d40c7c07-2f08-5cb2-bb8d-147ae1013350'
              capabilities:
                - 'gpu'
    environment:
      # - NVIDIA_VISIBLE_DEVICES=MIG-9ddf4c52-5275-52a0-8960-df3a71dbff79 # deprecated
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    volumes:
      # Mount for kapacitor data directory
      - ./kapacitor/data/:/var/lib/kapacitor
      # Mount for kapacitor configuration
      - ./kapacitor/config/:/etc/kapacitor
      # Mount for ai module logs
      - ./kapacitor/logs/:/var/log/kapacitor-ai
      # Mount for kapacitor predict UDF socket path
      - ./kapacitor/sock/:/var/run/kapacitor
      # Mount for ch-ai src path
      - ../ch-ai/src/:/opt/cloudhub/ch-ai-src
      # Mount for conda env path
      - ${CONDA_ENV_PATH}:/opt/cloudhub
    # Kapacitor requires network access to Influxdb
    links:
      - influxdb
    ports:
      # The API for Kapacitor is served on port 9092
      # To avoid collision against Kafka port
      #- "9092:9092"
      - '9094:9092'
    depends_on:
      - influxdb
    networks:
      brg:
        aliases:
          - kapacitor
    restart: always
    profiles:
      - gpu

  logstash:
    image: ch/logstash:${ELK_TAG}
    build:
      context: ./logstash/
      dockerfile: ./Dockerfile
      args:
        ELK_TAG: $ELK_TAG
    volumes:
      - type: bind
        source: ./logstash/config/logstash.yml
        target: /usr/share/logstash/config/logstash.yml
        read_only: true
      - type: bind
        source: ./logstash/pipeline
        target: /usr/share/logstash/pipeline
        read_only: true
      - type: bind
        source: ./logstash/logs
        target: /usr/share/logstash/logs
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx1g -Xms1g"
    depends_on:
      - influxdb
    networks:
      - brg
    restart: always

  etcd:
    # Use v3.5.x+ (v3.3.x uses deprecated Docker image format)
    #image: gcr.io/etcd-development/etcd:${ETCD_TAG}
    image: quay.io/coreos/etcd:${ETCD_TAG}
    entrypoint: /usr/local/bin/etcd
    environment:
      - ETCDCTL_API=3
    command:
      - '--name=${ETCD_NAME}'
      - '--data-dir=/var/lib/etcd'
      - '--initial-advertise-peer-urls=${ETCD_INITIAL_ADVERTISE_PEER_URLS}'
      - '--listen-peer-urls=${ETCD_LISTEN_PEER_URLS}'
      - '--listen-client-urls=${ETCD_LISTEN_CLIENT_URLS}'
      - '--advertise-client-urls=${ETCD_ADVERTISE_CLIENT_URLS}'
      - '--initial-cluster-token=etcd-cluster-token'
      - '--initial-cluster=${ETCD_INITIAL_CLUSTER}'
      - '--initial-cluster-state=new'
      - '--max-request-bytes=10485760' # 10 MBytes
      - '--quota-backend-bytes=8589934592' # 8 GBytes
      - '--auto-compaction-retention=24' # 24 hours
      - '--auto-tls'
      - '--peer-auto-tls'
    volumes:
      # Mount for etcd data directory
      - ./etcd/data:/var/lib/etcd
      # Mount for sharing Host domains
      - /etc/hosts:/etc/hosts
    ports:
      # The API for etcd is served on port
      - '2379:2379'
      - '2380:2380'
    networks:
      - brg
    restart: always

  dcgm-exporter:
    image: nvidia/dcgm-exporter:${DCGM_EXPORTER_TAG}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    hostname: ${HOSTNAME}
    ports:
      - '9400:9400'
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./dcgm-exporter/etc/:/etc/dcgm-exporter
    networks:
      - brg
    restart: always
    profiles:
      - gpu

networks:
  brg:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/16
          gateway: 172.10.0.1